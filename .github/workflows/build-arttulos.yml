name: Build ArttulOS ISO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman rpm

      - name: Build ISO in Docker
        run: |
          cd arttulos-os/scripts
          bash build_system.sh

      - name: Upload ISO artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arttulos-iso
          path: arttulos-os/scripts/output_iso/
          if-no-files-found: ignore

  test-packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Update pacman keyring
        run: pacman-key --init && pacman-key --populate archlinux
      - name: Test Pacman
        run: pacman -Sy --noconfirm --needed vim git
      - name: Test RPM (informational)
        run: echo "RPM testing requires target distro environment"
      - name: Test Nix (informational)
        run: echo "Nix testing requires nix daemon"
